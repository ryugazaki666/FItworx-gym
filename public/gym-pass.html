<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitworx Members – Mobile Membership Monitoring</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#e8eae7;--surface:#fff;--text:#16181d;--muted:#666c76;--border:#d3d7d2;--accent:#2440f0;--on-accent:#fff;--ok:#12805c;--warn:#d9560f;--bad:#c42b2b;--pass:#16181d;--on-pass:#f2f3ef;--tick-off:#454a55;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101215;--surface:#1b1e23;--text:#eceee9;--muted:#9a9fa8;--border:#2e323a;--accent:#7a8dff;--on-accent:#0b0d14;--ok:#3ccf9a;--warn:#ff8a4d;--bad:#ff6b6b;--pass:#2440f0;--on-pass:#fff;--tick-off:#5b6fe8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101215;--surface:#1b1e23;--text:#eceee9;--muted:#9a9fa8;--border:#2e323a;--accent:#7a8dff;--on-accent:#0b0d14;--ok:#3ccf9a;--warn:#ff8a4d;--bad:#ff6b6b;--pass:#2440f0;--on-pass:#fff;--tick-off:#5b6fe8;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:500 16px/1.45 Barlow,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;padding:20px 16px 96px}
h1,h2,h3{font-family:"Barlow Condensed",Impact,sans-serif;margin:0;letter-spacing:.01em;line-height:1.05}
h1{font-size:34px}h2{font-size:26px;margin:24px 0 12px}h3{font-size:20px}
.sub{color:var(--muted);margin:4px 0 0}
.pass{background:var(--pass);color:var(--on-pass);border-radius:22px;padding:20px;margin-top:18px;position:relative;overflow:hidden}
.pass::before{content:"";position:absolute;top:14px;right:50%;width:36px;height:8px;border-radius:8px;background:var(--bg);transform:translateX(50%)}
.pass .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.pass .plan{font:700 20px "Barlow Condensed",sans-serif;opacity:.8;margin-top:14px}
.pass .big{font:700 76px/0.9 "Barlow Condensed",sans-serif}
.pass .unit{font:600 18px "Barlow Condensed",sans-serif;opacity:.8;margin-left:6px}
.pass .name{font-weight:600;text-align:right}
.pass small{opacity:.75;display:block}
.ticks{display:grid;grid-template-columns:repeat(30,1fr);gap:3px;margin:18px 0 8px}
.ticks i{height:22px;border-radius:3px;background:var(--on-pass)}
.ticks i.off{background:var(--tick-off);opacity:.55}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600}
.s-active{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.s-soon{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.s-expired{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.s-pending{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.s-suspended{color:var(--muted);background:color-mix(in srgb,var(--muted) 15%,transparent)}
.pass .badge{background:var(--on-pass);color:var(--pass)}
.alert{margin-top:14px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.alert.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.alert.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--surface))}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 18px;font:600 16px Barlow,sans-serif;background:var(--accent);color:var(--on-accent);cursor:pointer;width:100%;min-height:48px}
.btn.alt{background:transparent;color:var(--text);border:1.5px solid var(--border)}
.btn.sm{width:auto;padding:8px 14px;min-height:36px;font-size:14px}
.btn:focus-visible,input:focus-visible,.tab:focus-visible,.chip:focus-visible,.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:15px}
input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font:500 16px Barlow,sans-serif}
.err{color:var(--bad);font-size:14px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1.5px solid var(--border);background:var(--surface);color:var(--text);border-radius:99px;padding:8px 14px;font:600 14px Barlow,sans-serif;cursor:pointer}
.hist{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.hist:last-child{border:0}
.empty{text-align:center;color:var(--muted);padding:24px 12px}
.seg{display:flex;background:var(--border);border-radius:12px;padding:3px;margin:18px 0 12px}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:9px;border-radius:10px;font:600 15px Barlow,sans-serif;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text)}
#qr{background:#fff;padding:16px;border-radius:18px;width:min(260px,100%);margin:18px auto 10px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:#16181d;text-align:center}
#qr svg{width:100%;height:auto;display:block}
.note{font-size:14px;color:var(--muted);margin-top:18px;text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:center}
nav .in{display:flex;width:100%;max-width:480px}
.tab{flex:1;padding:12px 4px 10px;background:none;border:0;color:var(--muted);font:600 13px Barlow,sans-serif;cursor:pointer}
.tab[aria-selected="true"]{color:var(--accent)}
.tab svg{display:block;margin:0 auto 2px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-left:4px;vertical-align:top}
.field{margin-bottom:14px}.field label{margin-top:0}.field select{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font:500 16px Barlow,sans-serif}.field input:focus,.field select:focus{outline:3px solid color-mix(in srgb,var(--accent) 25%,transparent);border-color:var(--accent)}
.plan-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.plan-choice{min-height:84px;padding:12px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);text-align:left;font:600 15px Barlow,sans-serif;cursor:pointer}.plan-choice[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}.plan-choice b{display:block;font:700 21px "Barlow Condensed",sans-serif;margin-top:4px}.plan-choice small{display:block;color:var(--muted);font-size:13px}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}.link-btn{border:0;background:none;color:var(--accent);font:600 15px Barlow,sans-serif;padding:8px 0;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav id="navwrap"><div class="in" role="tablist" id="nav"></div></nav>
<script>
const API=location.protocol==="file:"?"http://localhost:3001/api":"/api",TOKEN_KEY="fitworx-member-token";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"₱"+Number(n||0).toLocaleString("en-PH"),dateOnly=s=>String(s||"").slice(0,10);
const parse=s=>{const[a,b,c]=dateOnly(s).split("-").map(Number);return new Date(a,b-1,c)};
const fmt=s=>parse(s).toLocaleDateString("en-PH",{month:"short",day:"numeric",year:"numeric"});
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5),today=()=>{const d=new Date();d.setHours(0,0,0,0);return d.toISOString().slice(0,10)};
let me=null,plans=[],tab="home",rec="visits",screen="login",loginErr="",formErr="",selectedPlanId="";
async function api(path,options={}){const token=localStorage.getItem(TOKEN_KEY);const response=await fetch(API+path,{...options,headers:{...(options.body?{"Content-Type":"application/json"}:{}),...(token?{Authorization:`Bearer ${token}`}:{ }),...options.headers},body:options.body?JSON.stringify(options.body):undefined});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`Request failed (${response.status})`);return data}
function status(m){const left=diff(today(),m.expiration_date),total=Math.max(diff(m.start_date,m.expiration_date)+1,1);const key=["pending","suspended"].includes(m.status)?m.status:left<0?"expired":left<=7?"soon":"active";const label={pending:"Pending",suspended:"Suspended",expired:"Expired",soon:"Expiring soon",active:"Active"}[key];return{left:Math.max(left,0),over:Math.max(-left,0),total,key,label}}
async function loadMe(){try{me=await api("/member-portal/me");screen="app";await loadPlans()}catch{localStorage.removeItem(TOKEN_KEY);me=null;screen="login"}render()}
async function loadPlans(){try{plans=await api("/member-portal/plans");if(!selectedPlanId&&plans[0])selectedPlanId=String(plans[0].id)}catch(error){formErr=error.message}}
function planCard(p){return `<button type="button" class="plan-choice" data-plan="${p.id}" aria-pressed="${String(p.id)===selectedPlanId}">${esc(p.name)}<b>${money(p.price)}</b><small>${p.duration_days} days</small></button>`}
function nav(){const icons={home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',renew:'<path d="M20 7v5h-5M4 17v-5h5M5.5 9a7 7 0 0112-2L20 12M4 12l2.5 5a7 7 0 0012-2"/>',qr:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3M21 14v7h-4M14 21v-1"/>',records:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',alerts:'<path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 004 0"/>'},labels={home:"Pass",renew:"Renew",qr:"Check-in",records:"Records",alerts:"Alerts"};const pending=me?.renewals?.some(r=>r.status==="pending");$("#nav").innerHTML=me?Object.keys(labels).map(k=>`<button class="tab" role="tab" aria-selected="${tab===k}" data-tab="${k}"><svg viewBox="0 0 24 24">${icons[k]}</svg>${labels[k]}${k==="alerts"&&(status(me).key!=="active"||pending)?'<span class="dot" aria-label="Needs attention"></span>':""}</button>`).join(""):"";$("#navwrap").style.display=me?"flex":"none"}
function render(){const app=$("#app");app.innerHTML=screen==="register"?registerView():!me?loginView():tab==="home"?homeView():tab==="renew"?renewView():tab==="qr"?qrView():tab==="records"?recordsView():alertsView();nav();if(me&&tab==="qr")drawQR()}
function loginView(){return `<h1>Fitworx Members</h1><p class="sub">Your membership pass, subscription dates, and renewal requests.</p><form class="card" data-form="login" style="margin-top:18px"><div class="field"><label for="login-email">Email address</label><input id="login-email" name="email" type="email" autocomplete="username" required></div><div class="field"><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" required></div>${loginErr?`<div class="err" role="alert">${esc(loginErr)}</div>`:""}<button class="btn" style="margin-top:10px">Sign in</button></form><div class="card"><div class="topline"><div><b>New to Fitworx?</b><div class="sub">Register a membership and portal account.</div></div><button class="btn sm" data-act="open-register">Register</button></div></div>`}
function registerView(){return `<div class="topline"><div><h1>Join Fitworx</h1><p class="sub">Register your membership.</p></div><button class="link-btn" data-act="back-login">Sign in</button></div><form class="card" data-form="register" style="margin-top:16px"><div class="field"><label for="first-name">First name</label><input id="first-name" name="firstName" autocomplete="given-name" maxlength="80" required></div><div class="field"><label for="last-name">Last name</label><input id="last-name" name="lastName" autocomplete="family-name" maxlength="80" required></div><div class="field"><label for="register-email">Email address</label><input id="register-email" name="email" type="email" autocomplete="email" maxlength="254" required></div><div class="field"><label for="register-phone">Mobile number</label><input id="register-phone" name="phone" type="tel" autocomplete="tel" maxlength="32" required></div><div class="field"><label for="dob">Date of birth</label><input id="dob" name="dob" type="date"></div><div class="field"><label for="register-password">Create password</label><input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><small class="sub">Use at least 8 characters.</small></div><div class="section-label">Choose a plan</div><div class="plan-grid">${plans.map(planCard).join("")}</div><div class="field" style="margin-top:16px"><label for="payment-method">Payment method at reception</label><select id="payment-method" name="paymentMethod"><option>Cash</option><option>GCash</option></select></div>${formErr?`<div class="err" role="alert">${esc(formErr)}</div>`:""}<button class="btn" style="margin-top:10px">Register membership</button></form><p class="note">Payment remains pending until Fitworx staff records it.</p>`}
function homeView(){const m=me,st=status(m),on=Math.round(30*(st.key==="expired"||st.key==="pending"||st.key==="suspended"?0:st.left/st.total)),ticks=Array.from({length:30},(_,i)=>`<i class="${i<on?"":"off"}"></i>`).join(""),last=m.attendance?.[0],pending=m.renewals?.find(r=>r.status==="pending");const alert=st.key==="expired"?`<div class="alert bad"><b>Membership expired ${st.over} day${st.over===1?"":"s"} ago.</b> Request a renewal and confirm payment at reception.</div>`:st.key==="soon"?`<div class="alert"><b>Expires in ${st.left} day${st.left===1?"":"s"}.</b> Renew before ${fmt(m.expiration_date)}.</div>`:st.key==="pending"?`<div class="alert"><b>Membership pending confirmation.</b> Visit reception to confirm your registration payment.</div>`:st.key==="suspended"?`<div class="alert bad"><b>Membership suspended.</b> Please speak with Fitworx staff.</div>`:`<div class="alert ok">Your membership is active until ${fmt(m.expiration_date)}.</div>`;return `<h1>Hi, ${esc(m.first_name)}</h1><p class="sub">Member ID ${esc(m.id)} · Member since ${fmt(m.joined_date)}</p><div class="pass"><div class="plan">${esc(m.plan_name)} plan</div><div class="row"><div><span class="big">${st.left}</span><span class="unit">days left</span></div><div class="name">${esc(m.name)}</div></div><div class="ticks" aria-hidden="true">${ticks}</div><div class="row" style="align-items:center"><small>${fmt(m.start_date)} – ${fmt(m.expiration_date)}</small><span class="badge s-${st.key}">${st.label}</span></div></div>${alert}<div class="card" style="margin-top:14px"><div class="hist" style="padding-top:0"><span>Current plan</span><b>${esc(m.plan_name)}</b></div><div class="hist"><span>Expiry date</span><b>${fmt(m.expiration_date)}</b></div><div class="hist"><span>Last visit</span><b>${last?fmt(last.check_in):"No visits recorded"}</b></div><div class="hist"><span>Payment records</span><b>${m.payments?.length||0}</b></div></div>${pending?`<div class="alert">Renewal request pending staff review: ${esc(pending.plan_name)} · ${money(pending.amount)}</div>`:""}<button class="btn" data-act="go-renew">Manage renewal</button><button class="btn alt" style="margin-top:9px" data-act="logout">Sign out</button>`}
function renewView(){const pending=me.renewals?.find(r=>r.status==="pending");return `<h1>Renewal</h1><p class="sub">Request a plan renewal. Staff will confirm payment before extending your dates.</p><div class="card" style="margin-top:16px"><div class="hist" style="padding-top:0"><span>Current plan</span><b>${esc(me.plan_name)}</b></div><div class="hist"><span>Current expiry</span><b>${fmt(me.expiration_date)}</b></div><div class="hist"><span>Status</span><b class="badge s-${status(me).key}">${status(me).label}</b></div></div>${pending?`<div class="alert"><b>Request pending</b><div>${esc(pending.plan_name)} · ${money(pending.amount)} · ${fmt(pending.created_at)}</div></div><button class="btn alt" style="margin-top:12px" data-act="cancel-renewal" data-id="${esc(pending.id)}">Cancel request</button>`:`<form class="card" data-form="renew"><div class="section-label" style="margin-top:0">Select your next plan</div><div class="plan-grid">${plans.map(planCard).join("")}</div><div class="field" style="margin-top:16px"><label for="renew-method">Payment method at reception</label><select id="renew-method" name="paymentMethod"><option>Cash</option><option>GCash</option></select></div>${formErr?`<div class="err" role="alert">${esc(formErr)}</div>`:""}<button class="btn">Request renewal</button></form>`}<p class="note">The request does not extend your membership until staff confirms it.</p>`}
function qrView(){return `<h1>Check-in</h1><p class="sub">Show this secure membership code at the front desk.</p><div id="qr" role="img" aria-label="Secure Fitworx membership QR code">Loading code…</div><div style="text-align:center"><b style="font:700 26px 'Barlow Condensed',sans-serif">${esc(me.id)}</b><br><span class="badge s-${status(me).key}">${status(me).label} · until ${fmt(me.expiration_date)}</span></div>`}
async function drawQR(){const box=$("#qr");if(!box)return;try{const result=await api("/member-portal/qr");if($("#qr"))$("#qr").innerHTML=`<img alt="Secure membership QR code" src="${result.dataUrl}" style="width:100%;height:auto">`}catch(error){box.textContent=error.message}}
function recordsView(){const body=rec==="visits"?(me.attendance?.length?me.attendance.map(v=>`<div class="hist"><b>${fmt(v.check_in)}</b><span class="sub" style="margin:0">${v.check_out?fmt(v.check_out):"Checked in"}</span></div>`).join(""):'<div class="empty">No attendance recorded.</div>'):(me.payments?.length?me.payments.map(p=>`<div class="hist"><div><b>${esc(p.type.replace("_"," "))}</b><div class="sub">${fmt(p.paid_at)} · ${esc(p.method)} · ${esc(p.status)}</div></div><b>${money(p.amount)}</b></div>`).join(""):'<div class="empty">No payments recorded.</div>');return `<h1>Records</h1><p class="sub">Attendance and payments from the Fitworx database.</p><div class="seg" role="group" aria-label="Record type"><button data-rec="visits" aria-pressed="${rec==="visits"}">Attendance</button><button data-rec="pays" aria-pressed="${rec==="pays"}">Payments</button></div><div class="card">${body}</div>`}
function alertsView(){const st=status(me),items=[];if(st.key==="expired")items.push(["bad","Membership expired",`Expired on ${fmt(me.expiration_date)}. Request renewal.`]);else if(st.key==="soon")items.push(["warn","Expiring soon",`Expires ${fmt(me.expiration_date)} (${st.left} days left).`]);else items.push(["ok","Membership active",`Valid until ${fmt(me.expiration_date)}.`]);for(const r of me.renewals||[])items.push([r.status==="pending"?"warn":r.status==="completed"?"ok":"","Renewal request · "+r.status,`${esc(r.plan_name)} plan · ${money(r.amount)} · ${fmt(r.created_at)}.`]);for(const p of (me.payments||[]).slice(0,3))items.push([p.status==="paid"?"ok":"warn","Payment · "+p.status,`${money(p.amount)} · ${esc(p.method)} · ${fmt(p.paid_at)}.`]);return `<h1>Alerts</h1><p class="sub">Membership, renewal, and payment updates.</p><div style="margin-top:16px">${items.map(i=>`<div class="alert ${i[0]}" style="margin-top:12px"><b>${i[1]}</b><div>${i[2]}</div></div>`).join("")}</div>`}
async function handleSubmit(form){const data=new FormData(form);formErr="";try{if(form.dataset.form==="login"){const result=await api("/member-portal/login",{method:"POST",body:{email:data.get("email"),password:data.get("password")}});localStorage.setItem(TOKEN_KEY,result.token);await loadMe();return}if(form.dataset.form==="register"){if(!selectedPlanId)throw new Error("Choose an active membership plan.");const result=await api("/member-portal/register",{method:"POST",body:{firstName:data.get("firstName"),lastName:data.get("lastName"),email:data.get("email"),phone:data.get("phone"),dob:data.get("dob")||null,password:data.get("password"),planId:Number(selectedPlanId),paymentMethod:data.get("paymentMethod")}});localStorage.setItem(TOKEN_KEY,result.token);await loadMe();return}if(form.dataset.form==="renew"){await api("/member-portal/renewals",{method:"POST",body:{planId:Number(selectedPlanId),paymentMethod:data.get("paymentMethod")}});await loadMe();tab="renew";render()}}catch(error){formErr=error.message;render()}}
document.addEventListener("click",async e=>{const t=e.target.closest("[data-tab],[data-act],[data-plan],[data-rec]");if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;render();scrollTo(0,0)}else if(t.dataset.plan){selectedPlanId=t.dataset.plan;render()}else if(t.dataset.rec){rec=t.dataset.rec;render()}else if(t.dataset.act==="open-register"){await loadPlans();screen="register";formErr="";render();scrollTo(0,0)}else if(t.dataset.act==="back-login"){screen="login";render()}else if(t.dataset.act==="go-renew"){tab="renew";render();scrollTo(0,0)}else if(t.dataset.act==="cancel-renewal"){try{await api(`/member-portal/renewals/${encodeURIComponent(t.dataset.id)}`,{method:"DELETE"});await loadMe();tab="renew";render()}catch(error){formErr=error.message;render()}}else if(t.dataset.act==="logout"){localStorage.removeItem(TOKEN_KEY);me=null;screen="login";render()}});
document.addEventListener("submit",e=>{const form=e.target.closest("form[data-form]");if(!form)return;e.preventDefault();handleSubmit(form)});
api("/member-portal/plans").then(data=>{plans=data;if(data[0]&&!selectedPlanId)selectedPlanId=String(data[0].id);if(screen==="register")render()}).catch(()=>{});
if(localStorage.getItem(TOKEN_KEY))loadMe();else render();
</script>
</body>
</html>
